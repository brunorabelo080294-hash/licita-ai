name: Keep Render Alive (Ping)

on:
  schedule:
    # Dispara a cada 10 minutos para evitar que o Render entre em modo de suspensão
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Servidor Render
        run: |
          echo "Enviando ping para manter o Render acordado..."
          curl -s -f https://licita-ai-83sk.onrender.com/health || echo "Aviso: Servidor acordando..."
